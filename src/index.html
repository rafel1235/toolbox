<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Toolbox - Strumenti PDF gratuiti e sicuri</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
    <header>
        <h1>PDF Toolbox</h1>
        <p>Il tuo strumento PDF Local-first. Veloce, gratuito e rispettoso della privacy.</p>
    </header>

    <main>
        <div id="dropzone" class="file-dropzone">
            <p>Trascina qui il tuo file PDF oppure clicca per selezionarlo</p>
            <input type="file" id="file-input" accept="application/pdf" hidden>
        </div>

        <div id="file-info" class="file-info" style="display: none;">
            <h3>Dettagli File:</h3>
            <p id="file-name"></p>
            <p id="file-size"></p>
            <p id="file-pages"><em>Caricamento in corso...</em></p>
            
            <hr style="margin: 15px 0;">
            
            <!-- SEZIONE STRUMENTI -->
            <div id="tools-section" style="display: none;">
                
                <!-- Strumento 1: Estrai -->
                <div style="margin-bottom: 20px;">
                    <h4>Estrai Pagine</h4>
                    <label>Da:</label> <input type="number" id="start-page" min="1" value="1" style="width: 50px;">
                    <label>A:</label> <input type="number" id="end-page" min="1" style="width: 50px;">
                    <button id="btn-extract">Estrai</button>
                </div>

                <!-- Strumento 2: Elimina -->
                <div style="margin-bottom: 20px;">
                    <h4>Elimina Pagine</h4>
                    <label>Pagine (es. 1, 3, 5):</label> 
                    <input type="text" id="delete-pages" placeholder="es. 1, 3" style="width: 100px;">
                    <button id="btn-delete">Elimina</button>
                </div>

                <!-- Strumento 3: Ruota -->
                <div>
                    <h4>Ruota Pagine</h4>
                    <select id="rotate-degrees">
                        <option value="90">90° a Destra</option>
                        <option value="-90">90° a Sinistra</option>
                        <option value="180">180°</option>
                    </select>
                    <label>Pag. (vuoto = tutte):</label> 
                    <input type="number" id="rotate-page" min="1" placeholder="Tutte" style="width: 70px;">
                    <button id="btn-rotate">Ruota</button>
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
