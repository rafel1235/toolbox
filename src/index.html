<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Toolbox - Strumenti PDF gratuiti e sicuri</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
    <header>
        <h1>PDF Toolbox</h1>
        <p>Il tuo strumento PDF Local-first. Veloce, gratuito e rispettoso della privacy.</p>
    </header>

    <main>
        <div id="dropzone" class="file-dropzone">
            <p>Trascina qui il tuo file PDF oppure clicca per selezionarlo</p>
            <input type="file" id="file-input" accept="application/pdf" hidden>
        </div>

        <div id="file-info" class="file-info" style="display: none;">
            <h3>Dettagli File:</h3>
            <p id="file-name"></p>
            <p id="file-size"></p>
            <p id="file-pages"><em>Caricamento in corso...</em></p>
            
            <hr style="margin: 15px 0;">
            
            <!-- NUOVA SEZIONE: Strumenti -->
            <div id="tools-section" style="display: none;">
                <h4>Estrai Pagine</h4>
                <label for="start-page">Da pagina:</label>
                <input type="number" id="start-page" min="1" value="1" style="width: 60px;">
                
                <label for="end-page">A pagina:</label>
                <input type="number" id="end-page" min="1" style="width: 60px;">
                
                <button id="btn-extract" style="margin-left: 10px; padding: 5px 15px; cursor: pointer;">Estrai e Scarica</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
